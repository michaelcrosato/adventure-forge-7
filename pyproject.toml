[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adventure-forge"
version = "0.1.0"
description = "Unbounded Action Engine with Skyrim scale and BG3 depth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
af-verify = "adventure_forge.verification.verify:main"
af-play = "adventure_forge.player.cli:main"
af-flywheel = "adventure_forge.flywheel.loop:main"
zu-loop = "adventure_forge.flywheel.loop:main"
af-mcp = "adventure_forge.player.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.0.0",
    "ruff>=0.3.0",
]

[tool.vercel]
entrypoint = "app:app"

[tool.setuptools.packages.find]
include = ["adventure_forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true

