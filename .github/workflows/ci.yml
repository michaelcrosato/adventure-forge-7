name: AdventureForge Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest .

      - name: Lint and Type Check
        run: |
          ruff check .
          mypy .

      - name: Run Mechanical Verification Bar (I1-I8)
        run: |
          python3 -m adventure_forge.verification.verify

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Execute Autonomous Flywheel Cycles
        run: |
          python3 -m adventure_forge.flywheel.loop run --cycles 5

